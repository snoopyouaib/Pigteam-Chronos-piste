; Chrono GPS moto piste -- variante TFT ST7789 (320x240) + EC11 + 1 bouton
; --------------------------------------------------------------------------
; Point de depart du transfert depuis la variante OLED+encodeur
; (SH1106 128x64, CONFIRM+PUSH+BACK). Ici : un seul bouton physique en plus
; du PUSH de l'encodeur -- PUSH = valider/REC, bouton = BACK.
;
; ETAPE 1 (ce fichier) : socle materiel uniquement (ecran + splash + entrees).
; La logique GPS/CourseManager/menus/WebServer sera portee dans une etape
; suivante, une fois le cablage/l'affichage valides sur le banc.
;
; BIBLIOTHEQUE ECRAN : Adafruit_GFX + Adafruit_ST7789 (pas TFT_eSPI) --
; TFT_eSPI plante systematiquement (Guru Meditation StoreProhibited dans
; begin_tft_write()) sur ESP32-S3 avec les cœurs Arduino-ESP32 recents
; (>2.0.14) -- bug connu et non resolu a ce jour (cf. issues Bodmer/TFT_eSPI
; #3289, #3329, #3418, #3743 -- meme crash, memes symptomes, differents
; drivers/pins/cartes). Adafruit_ST7789 fonctionne correctement sur ces
; memes cœurs recents d'apres les retours de ces memes issues.
;
; Carte : ESP32-S3-Zero N8R8 -- 8MB flash / 8MB PSRAM en OCTALE --
; remplace le S3FH4R2 (4MB/2MB quad) d'origine, memes GPIO 1-13 (contrairement
; au S3-Tiny N8R8 de la variante OLED, decale sur 12-18 -- pas de changement
; de brochage a faire ici). Pas de puce USB-UART (CH343) sur ce genre de
; module -- port USB natif uniquement, d'ou ARDUINO_USB_CDC_ON_BOOT=1
; ci-dessous (meme note que la variante OLED).
;
; SD (reintroduction, etape 2 -- branchee sur g_logsFs/WebServerManager,
; cf. main.cpp) : partage le bus SPI de l'ecran (tftSPI, deja en
; SPIClass(FSPI)) -- MOSI/SCLK communs (GPIO 11/12), seuls CS (GPIO 4) et
; MISO (GPIO 5, inutilise par l'ecran, ecriture seule) sont dedies a la
; carte SD, sur les 3 GPIO libres restants (1, 4, 5 -- GPIO 1 laisse en
; reserve). <SD.h> plutot que SdFat (utilisee pour le test bas niveau de
; l'etape 1) : SdFat vit dans son propre namespace, ce qui evite bien le
; conflit avec fs::File constate a l'epoque, mais du coup n'implemente PAS
; fs::FS -- incompatible tel quel avec g_logsFs (fs::FS&) sans reecrire
; toute la couche d'acces fichier de WebServerManager.cpp. <SD.h>
; implemente fs::FS nativement (meme interface que LittleFS) et
; s'integre donc directement, SANS toucher a WebServerManager.cpp -- a
; condition que le probleme de compilation constate a l'epoque sur ce
; montage soit bien resolu par la version de plateforme actuelle (a
; confirmer a la prochaine compilation).

[env:esp32-s3-tft]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; -- Memoire (S3-Zero N8R8 : 8MB flash / 8MB PSRAM octale) --
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi ; PSRAM octale -- sans ce flag ESP.getPsramSize() renvoie 0 (necessaire ici, inutile/a eviter sur l'ancien S3FH4R2 en PSRAM quad)
board_build.filesystem = littlefs
board_build.partitions = partitions_ota.csv

; SD : la lib integree au framework Arduino-ESP32 (compatible ESP32-S3,
; herite de fs::FS) coexiste avec DEUX paquets homonymes sur le registre
; PlatformIO (arduino-libraries/SD@1.3.0 et adafruit/SD@0.0.0-alpha --
; ni l'un ni l'autre compatibles ESP32-S3). lib_ignore = SD a ete teste
; en premier mais exclut les DEUX versions indifferemment (la bonne
; comme la mauvaise, meme nom) -- fatal error: SD.h introuvable du tout.
; Fix retenu : la declarer explicitement dans lib_deps ci-dessous en
; pointant directement sur le dossier de la lib framework (via
; ${platformio.packages_dir}, variable PlatformIO qui se resout au
; chemin d'installation propre a chaque machine -- portable, pas de
; chemin utilisateur en dur) -- plus d'ambiguite possible, plus de
; recherche/telechargement sur le registre pour ce nom precis.

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
    igorantolic/Ai Esp32 Rotary Encoder@^1.7
    https://github.com/TheAngryRaven/DovesLapTimer.git
    file://${platformio.packages_dir}/framework-arduinoespressif32/libraries/SD
