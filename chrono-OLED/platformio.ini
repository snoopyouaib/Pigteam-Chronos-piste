; Chrono GPS moto piste -- variante OLED+encodeur sur ESP32-S3-Tiny (N8R8)
; --------------------------------------------------------------------
; Pour la moto du fils : pas d'affichage live (reste concentre sur le
; pilotage), juste dernier tour/meilleur tour + menu de selection de
; circuit a l'encodeur. GPS NEO-M8N en UART direct (plus de BLE/RaceBox).
;
; IMPORTANT (specifique a cette carte, migration depuis l'ESP32-S3-Zero) :
;  - Pas de puce USB-UART (CH343) -- port USB natif uniquement.
;    D'ou ARDUINO_USB_CDC_ON_BOOT=1 (oppose au firmware TFT), comme sur le Zero.
;  - Pas eu besoin de tenir BOOT pour flasher sur le test S3-Tiny nu -- si
;    jamais le flash echoue un jour, c'est le premier reflexe a essayer.
;  - 8MB flash / 8MB PSRAM (N8R8) -- PSRAM octale, necessite le memory_type
;    qio_opi explicite ci-dessous, sinon ESP.getPsramSize() renvoie 0
;    (confirme au banc : 0MB sans le flag, 8MB avec).
;  - GPIO33-37 reserves au PSRAM octal interne, indisponibles en externe --
;    memes plages qu'avant, evitees dans le cablage OLED/encodeur/boutons.
;  - table de partitions dediee (partitions_ota_8mb.csv) : app0/app1
;    gardees a la meme taille que sur le Zero, tout l'espace libere par
;    le passage 4MB->8MB va dans la partition spiffs (LittleFS) --
;    ~1.19MB avant, ~5.19MB maintenant, pour les logs GPS + le carnet de
;    session. C'est le but de cette carte : plus de marge pour enregistrer
;    sans avoir a purger les vieilles sessions aussi vite.
;  - SD (reintegration, logs GPS detailles) : bus SPI dedie sur pins
;    libres (CS=7, MOSI=8, MISO=9, SCLK=10) -- pas de partage possible
;    avec l'ecran comme sur la variante TFT (celui-ci est en I2C, aucun
;    bus SPI existant a reutiliser). Cablage valide au banc (sketch
;    isole sd-wiring-test-oled). <SD.h> plutot que SdFat, meme raison
;    que le TFT : implemente fs::FS nativement, s'integre directement
;    dans gpsLogFs sans toucher a WebServerManager.cpp (cf. README_FS.md).
;    lib_deps ci-dessous pointe explicitement sur la lib du framework
;    (${platformio.packages_dir}) pour eviter le conflit de nom avec les
;    paquets homonymes "SD" du registre public PlatformIO (aucun des
;    deux compatible ESP32-S3) -- meme piege que documente pour le TFT,
;    evite ici des le depart plutot que decouvert a la compilation.

[env:esp32-s3-tiny]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi  ; PSRAM octale du N8R8 -- sans ca, PSRAM detectee a 0
board_build.filesystem = littlefs  ; explicite -- pour que `pio run -t uploadfs` (dossier data/) parle bien le meme format que LittleFS.begin() dans le code
board_build.partitions = partitions_ota_8mb.csv ; spiffs agrandie a ~5.19MB (cf. commentaire plus haut) -- remplace partitions_ota.csv (4MB, S3-Zero)

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM

lib_deps =
    olikraus/U8g2@^2.35.30
    igorantolic/Ai Esp32 Rotary Encoder@^1.7
    https://github.com/TheAngryRaven/DovesLapTimer.git
    file://${platformio.packages_dir}/framework-arduinoespressif32/libraries/SD

