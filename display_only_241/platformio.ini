[env:display_only241]
; Version pinnee sur ce que le wiki Waveshare exige explicitement pour le
; 2.41 (Arduino core 3.0.7) -- on avait herite 53.03.13 (core 3.1.3, IDF
; 5.3.2) du projet 1.91 sans le revalider pour ce board. esp_lcd/spi_master
; a change de comportement entre IDF 5.1 et 5.3 ; possible cause du driver
; qui tourne sans erreur mais n'affiche rien (12/08).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D LV_CONF_INCLUDE_SIMPLE
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384

lib_deps =
    lvgl/lvgl@8.4.0
    hideakitai/ArxTypeTraits

monitor_speed = 115200
upload_speed = 921600
