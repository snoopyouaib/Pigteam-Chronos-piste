[env:raw_official_test]
; Test brut : le .ino officiel Waveshare 09_LVGL_Test, quasi non modifie
; (juste ajout de #include <Arduino.h> obligatoire pour un .cpp PlatformIO,
; et lv_demo_widgets() remplace par un simple fond rouge plein ecran pour
; eviter de configurer LV_USE_DEMO_WIDGETS). But : verifier si le meme code
; bas niveau que celui qui marche en Arduino IDE marche aussi via
; PlatformIO, meme plateforme/version que display_only_241.
; Retour a 51.03.07 (deja en cache local, compile connu) -- on arrete de
; changer de version de plateforme, ca consomme du temps reseau/tooling
; sans gain demontre. Nouveau test cible : PSRAM completement desactivee
; (qio_qspi au lieu de qio_opi) pour voir si la config PSRAM octale
; elle-meme perturbe quelque chose au boot, sans rapport avec l'ecran en
; theorie mais on isole la variable.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D LV_CONF_INCLUDE_SIMPLE
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384

lib_deps =
    lvgl/lvgl@8.4.0

monitor_speed = 115200
monitor_filters = time
upload_speed = 921600
