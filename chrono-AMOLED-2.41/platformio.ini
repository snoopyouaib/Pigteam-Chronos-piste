[env:firmware241]
; Toolchain unifie avec le 1.91 (confirme au banc 2.41 le 14/08 -- le
; bug ecran noir historique venait du reset TCA9554 propre a la carte
; V2, pas de la version du core ; 53.03.13 boote tout aussi bien que
; 51.03.07 sur ce hardware).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = partitions_ota_16mb.csv
board_build.filesystem = littlefs

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D LV_CONF_INCLUDE_SIMPLE
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384

lib_deps =
    lvgl/lvgl@8.4.0
    hideakitai/ArxTypeTraits

monitor_speed = 115200
monitor_filters = time  ; horodatage ms sur chaque ligne -- utile pour mesurer l'ecart exact entre deux evenements (cf. diagnostic bouton BACK du 28/07)
upload_speed = 921600

; JTAG natif ESP32-S3 (via le meme port USB-C que la programmation/le
; Serial, pas de sonde externe necessaire) -- prevu pour finir d'isoler
; le bug memoire de WebServerManager.cpp (corruption entre l'appel a
; loadLapsForSession() et l'affichage de compactKey dans
; handleHomePage()). Contourne pour l'instant (bloc retire de la page
; d'accueil, cf. commentaire "DESACTIVE TEMPORAIREMENT" dans le
; fichier) mais pas reellement corrige -- cause exacte encore inconnue.
debug_tool = esp-builtin
debug_init_break = tbreak setup
